<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="styles.css"/>
</head>

 <body>


    <h1 id="heading">Your MET Feed</h1>
    <p id="sub-heading">Discover art from the Metropolitan Museum of Art!</p>


    <h2>Choose Your Art!</h2>
    <div class="form"> 
        <label>What deparment would you like to see art from?</label>
        <select id="deparments">
            <option value="dept1">Dept1</option>
            <option value="dept2">Dept2</option>
        </select>
        <button id="submit">Submit</button>
    </div>
    
    <div class="artwork">
        <p id="art-title">Title:</p>
        <p id="art-artist">Artist:</p>
        <p id="art-date">Date:</p>
    </div>

<script src="script.js"></script>
 </body>

</html>
